# PROOF ONLY (hh 26691, @cto shape pending): the checker is not a devDependency; this run fetches it at run time,
# pinned to an exact commit, and runs it cold on Node 24. This branch is never merged.
name: Proof pinned checker

on:
  push:
    branches: [proof/26691-pinned-checker]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CHECKER_COMMIT: 9c14dbfe400bb07589b929432aaf9f5649a9bcd7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: No checker comes from this repository's dependencies
        run: test ! -e node_modules/.bin/verify-publishable && ! grep -q verify-publishable package.json bun.lock
      - name: Fetch the checker at its pinned commit
        run: |
          git clone --quiet https://github.com/beorn/verify-publishable.git "$RUNNER_TEMP/checker"
          git -C "$RUNNER_TEMP/checker" checkout --quiet --detach "$CHECKER_COMMIT"
          test "$(git -C "$RUNNER_TEMP/checker" rev-parse HEAD)" = "$CHECKER_COMMIT"
          (cd "$RUNNER_TEMP/checker" && bun install --frozen-lockfile)
      - name: Run the pinned checker on this repository
        run: |
          node --version
          mkdir "$RUNNER_TEMP/verified-tarballs"
          "$RUNNER_TEMP/checker/bin/verify-publishable" --output-dir "$RUNNER_TEMP/verified-tarballs" > "$RUNNER_TEMP/verified.json"
          node -e 'const v = require(process.argv[1]); if (v.ok !== true) throw Error("checker did not pass"); for (const p of v.packages) console.log("verified " + p.name + "@" + p.version + " " + p.sha512)' "$RUNNER_TEMP/verified.json"
