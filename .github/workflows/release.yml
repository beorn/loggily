# vendor-kit-override: #26691 dispatch/OIDC spike; return the proven shape to vendor-kit before bulk rollout
name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: npm package to publish
        required: true
        type: string
      version:
        description: Published semver version
        required: true
        type: string
      commit:
        description: Full source commit on main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: ${{ inputs.package }}
      PACKAGE_VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dispatch source
        shell: bash
        run: |
          if [[ "$PACKAGE_NAME" != loggily ]]; then
            echo "::error::expected package loggily, got $PACKAGE_NAME"
            exit 1
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid release version: $PACKAGE_VERSION"
            exit 1
          fi
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full lowercase SHA"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]]; then
            echo "::error::checkout differs from requested commit"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main; then
            echo "::error::requested commit is not on main"
            exit 1
          fi
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$ACTUAL_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::manifest version $ACTUAL_VERSION differs from requested $PACKAGE_VERSION"
            exit 1
          fi
          REPOSITORY_URL="$(node -p "require('./package.json').repository.url")"
          if [[ "$REPOSITORY_URL" != "https://github.com/beorn/loggily.git" ]]; then
            echo "::error::manifest repository $REPOSITORY_URL does not match this public publisher"
            exit 1
          fi
          VERSION_URL="https://registry.npmjs.org/loggily/$PACKAGE_VERSION"
          HTTP_STATUS="$(curl --location --silent --show-error --max-time 15 --output "$RUNNER_TEMP/loggily-version.json" --write-out '%{http_code}' "$VERSION_URL")"
          case "$HTTP_STATUS" in
            404) ;;
            200) echo "::error::loggily@$PACKAGE_VERSION already exists; inspect its attestation and integrity before resuming"; exit 1 ;;
            *) echo "::error::registry query $VERSION_URL returned HTTP $HTTP_STATUS"; exit 1 ;;
          esac

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Verify npm Trusted Publishing client
        run: |
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) throw Error("npm >=11.5.1 required for Trusted Publishing; found " + process.argv[1])' "$(npm --version)"

      - name: Record dispatch OIDC claims without exposing the token
        run: |
          node --input-type=module -e '
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL
            const bearer = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN
            if (!url || !bearer) throw Error("GitHub OIDC request capability missing")
            const response = await fetch(url, { headers: { Authorization: "bearer " + bearer } })
            if (!response.ok) throw Error("GitHub OIDC claim request failed: HTTP " + response.status)
            const token = (await response.json()).value
            if (typeof token !== "string" || token.split(".").length !== 3) throw Error("GitHub OIDC response has no JWT")
            const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString())
            const selected = Object.fromEntries(["iss", "aud", "sub", "repository", "workflow", "workflow_ref", "sha", "event_name", "ref"].map((key) => [key, claims[key]]))
            if (selected.repository !== "beorn/loggily" || selected.event_name !== "workflow_dispatch") throw Error("unexpected dispatch identity: " + JSON.stringify(selected))
            console.log("Dispatch OIDC claims: " + JSON.stringify(selected))
          '

      - run: bun install --frozen-lockfile
      - run: bun run test

      - name: Pack and verify the exact artifact
        id: artifact
        shell: bash
        run: |
          PACK_DIR="$(mktemp -d "$RUNNER_TEMP/loggily-pack.XXXXXX")"
          pnpm pack --pack-destination "$PACK_DIR"
          TARBALL="$PACK_DIR/loggily-$PACKAGE_VERSION.tgz"
          if [[ ! -f "$TARBALL" ]]; then
            echo "::error::pnpm pack did not create $TARBALL"
            exit 1
          fi
          VERIFY_DIR="$(mktemp -d "$RUNNER_TEMP/loggily-verify.XXXXXX")"
          npm install --ignore-scripts --prefix "$VERIFY_DIR" "$TARBALL"
          (cd "$VERIFY_DIR" && node --input-type=module -e 'const pkg = await import("loggily"); if (typeof pkg.createLogger !== "function" || typeof pkg.setDefaultOutput !== "function") throw Error("packed public exports missing")')
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "Verified $TARBALL at $INTEGRITY"

      - name: Publish the verified artifact with OIDC
        run: pnpm publish "${{ steps.artifact.outputs.tarball }}" --access public --no-git-checks --provenance

      - name: Confirm registry bytes
        env:
          EXPECTED_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            VERSION_URL="https://registry.npmjs.org/loggily/$PACKAGE_VERSION"
            HTTP_STATUS="$(curl --location --silent --show-error --max-time 15 --output "$RUNNER_TEMP/loggily-published.json" --write-out '%{http_code}' "$VERSION_URL")"
            if [[ "$HTTP_STATUS" == 404 ]]; then
              sleep 5
              continue
            fi
            if [[ "$HTTP_STATUS" != 200 ]]; then
              echo "::error::registry query $VERSION_URL returned HTTP $HTTP_STATUS"
              exit 1
            fi
            ACTUAL_INTEGRITY="$(node -e 'const p=require(process.argv[1]); if (typeof p.dist?.integrity !== "string") throw Error("registry version has no dist.integrity"); process.stdout.write(p.dist.integrity)' "$RUNNER_TEMP/loggily-published.json")"
            if [[ "$ACTUAL_INTEGRITY" == "$EXPECTED_INTEGRITY" ]]; then
              echo "Registry integrity matches the published artifact: $EXPECTED_INTEGRITY"
              node -e 'const p=require(process.argv[1]); const attest=p.dist?.attestations; if (typeof attest?.url !== "string" || attest.provenance?.predicateType !== "https://slsa.dev/provenance/v1") throw Error("registry version has no provenance attestation"); console.log("Registry attestation: " + attest.url)' "$RUNNER_TEMP/loggily-published.json"
              exit 0
            fi
            echo "::error::registry integrity $ACTUAL_INTEGRITY differs from $EXPECTED_INTEGRITY"
            exit 1
          done
          echo "::error::registry did not serve loggily@$PACKAGE_VERSION after bounded readback"
          exit 1
